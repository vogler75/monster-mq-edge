NodeId: edge

TCP:  { Enabled: true,  Port: 1883, Address: "0.0.0.0" }
TCPS: { Enabled: false, Port: 8883, Address: "0.0.0.0", KeyStorePath: "", KeyStorePassword: "" }
WS:   { Enabled: true,  Port: 1884, Address: "0.0.0.0" }
WSS:  { Enabled: false, Port: 8884, Address: "0.0.0.0" }
MaxMessageSize: 1048576
QueuedMessagesEnabled: false

DefaultStoreType: SQLITE

ConfigStoreType: SQLITE
SessionStoreType: SQLITE
RetainedStoreType: MEMORY
QueueStoreType: MEMORY

SQLite:
  Path: /cfg-data/monstermq.db

UserManagement:
  Enabled: true
  PasswordAlgorithm: BCRYPT
  AnonymousEnabled: true
  AclCacheEnabled: true
  AllowAnonymousLocalhost: true

Metrics:
  Enabled: true
  StoreType: MEMORY
  CollectionIntervalSeconds: 1
  RetentionHours: 168

Logging:
  Level: INFO
  MqttSyslogEnabled: false
  RingBufferSize: 1000

GraphQL:
  Enabled: true
  Port: 4000
  TLSPort: 4443
  TLSAddress: "0.0.0.0"
  RequireHTTPSFromOutside: false  
  KeyStorePath: "/cfg-data/server.crt" # Path to certificate PEM (defaults to SSL.KeyStorePath or data/server.crt)
  KeyPath: "/cfg-data/server.key"      # Path to private key PEM (defaults to SSL.KeyPath or data/server.key)

Features:
  DeviceImportExport: true
  MqttClient: true
  WinCCUa: true
  WinCCOa: true
  MCP: false
  Hmi: true
  Redfish: false
  RtspCamera: true
  PythonScripts: true

HMI:
  Enabled: true
  Path: "/cfg-data/hmi"
  MountPath: "/hmi"
  SyncEnabled: true
  SyncBaseTopic: "monstermq/hmi/sync"

MCP:
  Enabled: false
    